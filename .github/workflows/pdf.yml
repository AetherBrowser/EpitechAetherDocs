name: Build PDFs

on:
  push:
    paths:
      - "docs/**"
      - "template/**"
      - "scripts/build-pdf.sh"
      - ".github/workflows/pdf.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            lmodern

      - name: Convert Markdown to PDF
        run: bash scripts/build-pdf.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-docs-pdf
          path: dist/*.pdf
          if-no-files-found: error

      - name: Layout for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/objectives
          shopt -s nullglob
          objectives=""
          others=""
          html_escape() {
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g'
          }
          for pdf in dist/*.pdf; do
            base="$(basename "$pdf")"
            stem="${base%.pdf}"
            title="$(awk '
              /^---$/ { n++; next }
              n == 1 && /^title:/ {
                sub(/^title:[[:space:]]*/, "")
                gsub(/^"|"$/, "")
                print
                exit
              }
              n >= 2 { exit }
            ' "docs/${stem}.md")"
            [ -n "$title" ] || title="$stem"
            title="$(printf '%s' "$title" | html_escape)"
            case "$base" in
              obj*.pdf)
                cp "$pdf" "site/objectives/$base"
                objectives="${objectives}<li><a href=\"objectives/${base}\">${title}</a></li>"
                ;;
              *)
                cp "$pdf" "site/$base"
                others="${others}<li><a href=\"${base}\">${title}</a></li>"
                ;;
            esac
          done
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Aether documents</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1E2761; }
              h1 { font-size: 1.6rem; }
              h2 { font-size: 1.1rem; color: #2C5F2D; }
              a { color: #1E2761; }
            </style>
          </head>
          <body>
            <h1>Aether documents</h1>
            <h2>Objectives</h2>
            <ul>${objectives}</ul>
            <h2>Other documents</h2>
            <ul>${others}</ul>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pdf
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
